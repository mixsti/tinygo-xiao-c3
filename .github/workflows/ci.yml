name: ci

on:
  push:
  pull_request:

jobs:
  xiao-esp32c3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.4"

      - name: Install TinyGo 0.44.0
        run: |
          curl -fsSL -o /tmp/tinygo.tar.gz \
            https://github.com/tinygo-org/tinygo/releases/download/v0.44.0/tinygo0.44.0.linux-amd64.tar.gz
          sudo tar -C /usr/local -xzf /tmp/tinygo.tar.gz
          echo "/usr/local/tinygo/bin" >> "$GITHUB_PATH"

      - name: Host tests
        run: go test ./...

      - name: Build examples
        run: make build WIFI_SSID=ci WIFI_PASS=ci
